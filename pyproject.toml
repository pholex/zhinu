[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI 上 `xiaoyu` 已被占用，发布名用 xiaoyu-agent；导入名和命令仍是 xiaoyu / xy。
name = "xiaoyu-agent"
# 版本号单一来源：xiaoyu/__init__.py 的 __version__（--version 也读它）
dynamic = ["version"]
description = "小羽 — a harness coding agent"
readme = "README.md"
# MIT（2026-08-16 定，单一开发者阶段；有外部贡献者再议是否换协议）。
# PEP 639 SPDX 字符串形式：table 形式已被新 setuptools 弃用
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# 精确锁版本（供应链纪律）：范围声明会让 PyPI 上被投毒的
# 新版本无需审查自动进入用户机器。升级 = 有意改这一行并重跑测试。
dependencies = [
    "openai==2.52.0",
    #  Anthropic Messages 协议直连（xiaoyu/messages.py）。与 openai 同为
    #  Stainless 生成、共享 httpx 传输，锁版本纪律相同
    "anthropic==0.121.0",
    #  bash 语法白名单解析（权限判定用）：解析失败/缺包时代码自动回退字符串黑名单，
    #  所以两个包即使某平台没有 wheel 也不致命
    "tree-sitter>=0.22",
    "tree-sitter-bash>=0.21",
]

[project.optional-dependencies]
sdk = ["jsonschema==4.26.0"]
# TUI 前端（输入补全/跨会话历史/底部状态栏/富文本确认框）。
# 可选：缺包时自动退回明文 REPL。同主依赖一样精确锁版本；
# rich 不用 15.x——刚发的大版本先观望，14 线是成熟尾版。
tui = [
    "prompt_toolkit==3.0.53",
    "rich==15.0.0",
]
# 可选：browser 工具的引擎。装完还需跑一次 `playwright install chromium`
# 下载浏览器内核；没装 playwright 时 browser 工具经 check_fn 自动隐藏。
browser = [
    "playwright==1.62.0",
]
# 可选：AWS Bedrock 直连（XIAOYU_BEDROCK_REGION）。anthropic SDK 的 SigV4 签名
# 要 botocore；凭据走 AWS 默认凭证链，所以不引入别的东西。缺包时首个请求前报
# 一句怎么装（见 messages.bedrock_client）。
bedrock = [
    "boto3==1.43.105",
    "botocore==1.43.105",
]
# 可选：`xiaoyu serve` 的 HTTP API（给 n8n / Dify 这类编排器用）。
# 只影响这一条命令，缺包时 serve 报一句怎么装就退出。选 fastapi 是为了让
# OpenAPI schema 由代码生成（Dify 自定义工具吃它），手写的会随代码漂移。
#  ⚠️ 锁版本要查 PyPI 现状再填，别凭印象——0.31.5 首发时锁的 fastapi==0.121.2
#  是 2025-11 的版本，落后九个月约 20 个 minor。锁版本的目的是"有意识地选一个
#  审查过的版本"，钉一个旧的等于把目的反过来做。
# 可选：OpenTelemetry 导出（docs/observability.md）。只在用户设了标准 OTEL_* 变量时
# 才 import；没设时一个字节不发、包都不加载。下限钉在实现时核对过的现版，不锁死：
# OTel SDK 与用户自己的 collector / 其它 instrumentation 共存，锁死会跟别人的钉版本打架
otel = [
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
]
serve = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    # 浏览器桥的 WebSocket（uvicorn 不带 ws 实现，缺它 /session/{id}/browser 握手直接 500）
    "websockets==17.1",
]

[project.urls]
Homepage = "https://xiaoyu.openapi.click"
Repository = "https://github.com/pholex/zhinu"
Issues = "https://github.com/pholex/zhinu/issues"

[project.scripts]
# 入口走 __main__：`term log` / `term info` 在导入 cli 之前拦下来走快路径
# （shell 钩子与提示符要调它，等不起 agent/tools 整套导入），其余照旧进 cli.main
xiaoyu = "xiaoyu.__main__:main"
xy = "xiaoyu.__main__:main"
# 与包同名的别名：uvx 默认跑「与包同名的 console script」，ACP registry 的
# uvx 分发（uvx xiaoyu-agent --acp）靠它一跑即中，无需 --from
xiaoyu-agent = "xiaoyu.__main__:main"
xiaoyu-eval = "xiaoyu.evals.runner:main"

[tool.setuptools]
packages = ["xiaoyu", "xiaoyu.evals"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "xiaoyu.__version__"}

# models.example.json 是 models.py 找不到本机数据时的兜底（按包路径读取），
# 必须随包分发；models.local.json 是本机私有数据，不入库也不进 wheel/sdist。
[tool.setuptools.package-data]
"xiaoyu.evals" = ["models.example.json"]
# 扩展指南随包分发（"文档即能力"）：system prompt 里只放它的绝对路径，
# 模型要给小羽写技能/插件时现读——扩展格式不该靠训练记忆
xiaoyu = ["py.typed", "docs/extending.md"]
