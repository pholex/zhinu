name: sdk-reliability

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Frozen deterministic batch (never invokes real providers)
        options: [contracts, lifecycle, soak, backpressure]
        default: contracts
      profile:
        type: choice
        description: Contract repetition profile (20 or 100 repetitions)
        options: [sdk-local, sdk-faults, sdk-fault-windows, sdk-recovery-faults, sdk-mcp-shutdown, sdk-protocol-faults, sdk-mcp-lifecycle, sdk-cross-platform, sdk-storage-concurrency, sdk-storage-initialization]
        default: sdk-local

jobs:
  reliability:
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[sdk]" -e "packages/xiaoyu-agent-sdk[telemetry]" opentelemetry-sdk==1.45.0 psutil==7.2.2
      - run: python scripts/sdk_reliability.py --mode ${{ inputs.mode }} --config tests/reliability/${{ inputs.profile }}.json --output reliability-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sdk-reliability-${{ inputs.mode }}-${{ matrix.os }}-py${{ matrix.python }}
          path: reliability-results
          if-no-files-found: error
