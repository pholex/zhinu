# 密钥扫描：gitleaks 两路——① 仓库历史（push / PR 扫本次范围，定时与手动触发扫全历史），
# ② 打出来的 sdist（用户 `pip install` 真正拿到的东西）。
#
# 与 ci.yml 里那条手写正则 grep 是两层，不是替换：grep 只认四种通用特征、零依赖、永远在；
# gitleaks 规则集大得多（各家 token 形状 + 熵），但它是外部 action，哪天不可用了 grep 还兜着。
# 放行规则在 .gitleaks.toml，只许「路径 AND 整行正则」同时命中（理由写在那个文件里）。
#
# action 钉 commit SHA 并注释版本号（AGENTS.md 的纪律）。gitleaks-action 对个人账号仓库
# 不要 license；仓库若转到组织名下要补 GITLEAKS_LICENSE secret。
name: secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    #  每周一凌晨扫一次全历史：push 事件只扫本次推上来的提交范围，全历史要靠这一条
    #  （gitleaks-action 在 schedule / workflow_dispatch 下扫整个仓库）
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 全历史：浅克隆下 gitleaks 只能看到最后一个提交
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          #  不往 PR 下留言：那要 pull-requests: write，本 workflow 只读。命中看 job 日志与 SARIF 产物
          GITLEAKS_ENABLE_COMMENTS: "false"

  sdist:
    #  发布物单独扫一遍：MANIFEST.in 剪掉了 tests/ 与 docs/，历史里放行的测试夹具不该出现在
    #  这里；反过来，只进 sdist 不进 git 的生成物（版本文件等）历史扫描看不到
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      #  gitleaks_8.30.1_checksums.txt 里 linux_x64 那一行；升版本两处一起改
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - name: 取 gitleaks 二进制（校验 sha256，不信任 latest）
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: 解包 sdist 并扫描
        run: |
          mkdir /tmp/audit && tar -xzf dist/*.tar.gz -C /tmp/audit
          /tmp/gitleaks dir /tmp/audit --config .gitleaks.toml --no-banner --redact --exit-code 1
