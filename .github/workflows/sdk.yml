name: sdk

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["xiaoyu/**", "packages/xiaoyu-agent-sdk/**", "tests/*sdk*", "scripts/**", "examples/sdk/**", ".github/workflows/**", "pyproject.toml", "MANIFEST.in"]
  pull_request:
    paths: ["xiaoyu/**", "packages/xiaoyu-agent-sdk/**", "tests/*sdk*", "scripts/**", "examples/sdk/**", ".github/workflows/**", "pyproject.toml", "MANIFEST.in"]

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[sdk]"
      - run: python -m pip install -e packages/xiaoyu-agent-sdk
      - run: python -m pip install mypy==2.3.1
      - run: python -m pip install opentelemetry-sdk==1.45.0
      - run: python -m mypy --follow-imports=silent packages/xiaoyu-agent-sdk/src examples/sdk
      - run: python -m unittest tests.test_sdk tests.test_sdk_storage tests.test_sdk_tasks tests.test_sdk_mcp_management tests.test_sdk_accounting tests.test_sdk_transport_reliability tests.test_sdk_fault_windows tests.test_sdk_reliability tests.test_sandbox.WorkspaceTrustCacheTest tests.test_sdk_release tests.test_public_api tests.test_embedding_smoke -v
      - run: python examples/sdk/sync.py --demo
      - run: python examples/sdk/async_service.py --demo
      - run: python examples/sdk/storage.py --demo
      - run: python examples/sdk/orchestration.py --demo
      - run: python examples/sdk/mcp_management.py --demo

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python scripts/build_sdk.py
      - run: python -m venv /tmp/sdk-install
      - run: /tmp/sdk-install/bin/python -m pip install --find-links dist/sdk-release/kernel dist/sdk-release/sdk/*.whl
      - run: /tmp/sdk-install/bin/python -m pip check
      - run: /tmp/sdk-install/bin/python -I tests/sdk_wheel_smoke.py
