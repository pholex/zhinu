[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoyu-agent-sdk"
dynamic = ["version", "dependencies"]
description = "In-process Python SDK for the Xiaoyu workspace execution engine"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
telemetry = ["opentelemetry-api==1.45.0"]

[project.urls]
Repository = "https://github.com/pholex/zhinu"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["xiaoyu_agent_sdk"]
namespaces = false

[tool.setuptools.package-data]
xiaoyu_agent_sdk = ["py.typed"]
